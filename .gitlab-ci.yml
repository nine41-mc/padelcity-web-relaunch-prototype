# PadelCity website prototype → GitLab Pages (static export). Same gates as .github/workflows/checks.yml.
#
# - Every pipeline runs the checks: lint, types, Code Connect, tokens, then `npm run qa` (Chromium, 390 and 1440 px).
# - Pages deploys on the default branch, on schedules (e.g. nightly, to pick up Contentful changes)
#   and when triggered manually ("Run pipeline") – only when all checks pass.
# - Contentful credentials come from masked CI/CD variables (Settings → CI/CD → Variables):
#   CONTENTFUL_SPACE_ID, CONTENTFUL_ENVIRONMENT_ID, CONTENTFUL_DELIVERY_TOKEN.
#   Without them the build falls back to mock data.
# - Licensed fonts: CI/CD variable FONTS_DEPLOY_KEY (type File, not protected – branch pipelines build too) with the
#   private key of a read-only deploy key on github.com/nine41-mc/padelcity-brand-fonts. Without it build and deploy stop.
# - Pages access is restricted to project members (Settings → General → Visibility → Pages).

image: node:24.19.0-slim

stages:
  - check
  - build
  - qa
  - deploy

# One pipeline per change: merge request pipelines, otherwise branch pipelines
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  NEXT_TELEMETRY_DISABLED: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

# Söhne Schmal and Good Brush from the private fonts repo (never committed)
.licensed-fonts:
  before_script:
    - test -f "$FONTS_DEPLOY_KEY" || { echo "CI/CD-Variable FONTS_DEPLOY_KEY fehlt (siehe Kopf dieser Datei)."; exit 1; }
    - apt-get update -qq && apt-get install -y -qq git openssh-client > /dev/null
    # GitLab drops the trailing newline of file variables – ssh then cannot read the key ("error in libcrypto")
    - KEY_FILE="$(mktemp)" && { cat "$FONTS_DEPLOY_KEY"; echo; } > "$KEY_FILE" && chmod 600 "$KEY_FILE"
    - GIT_SSH_COMMAND="ssh -i $KEY_FILE -o StrictHostKeyChecking=accept-new" git clone --depth 1 git@github.com:nine41-mc/padelcity-brand-fonts.git .brand-fonts
    - rm -f "$KEY_FILE"
    - mkdir -p src/app/fonts/licensed
    - cp .brand-fonts/GoodBrush.otf .brand-fonts/SoehneSchmal-FettKursiv.ttf src/app/fonts/licensed/
    - rm -rf .brand-fonts

code:
  stage: check
  script:
    - npm ci --no-audit --no-fund
    - npm run lint
    - npx tsc --noEmit
    - npm run figma:check
    - npm run tokens:check

# Export for the QA: same data as Pages (Contentful when the variables are set), but no basePath – QA serves it from /
export:
  stage: build
  extends: .licensed-fonts
  script:
    - npm ci --no-audit --no-fund
    - npm run build
  artifacts:
    paths:
      - out
    expire_in: 1 day

# Lighter than GitHub on purpose: the K8s runner ran out of space with Chromium and needed ~2 h per browser for the
# full matrix. Here Chromium in phone and desktop width; WebKit, Firefox and 768 px run in .github/workflows/checks.yml.
qa:
  stage: qa
  image: mcr.microsoft.com/playwright:v1.58.2-noble
  needs: [ export ]
  script:
    - npm ci --no-audit --no-fund
    - npm run qa -- --browsers chromium --widths 390,1440 --parallel 2
  artifacts:
    when: on_failure
    paths:
      - .qa/report.json
    expire_in: 1 week

pages:
  stage: deploy
  extends: .licensed-fonts
  script:
    - npm ci --no-audit --no-fund
    # Pages may serve the site from a sub-path (https://<group>.<pages-domain>/<project>/).
    - export NEXT_PUBLIC_BASE_PATH="$(node -e 'const p=new URL(process.env.CI_PAGES_URL).pathname.replace(/\/$/,"");process.stdout.write(p)')"
    - echo "basePath='${NEXT_PUBLIC_BASE_PATH}'"
    - npm run build
  publish: out
  artifacts:
    paths:
      - out
    # Keep the GitLab disk small: Pages keeps its own copy after deployment.
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
