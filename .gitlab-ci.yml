# PadelCity website prototype → GitLab Pages (static export).
#
# - Runs on the default branch, on schedules (e.g. nightly, to pick up Contentful changes)
#   and when triggered manually ("Run pipeline").
# - Contentful credentials come from masked CI/CD variables (Settings → CI/CD → Variables):
#   CONTENTFUL_SPACE_ID, CONTENTFUL_ENVIRONMENT_ID, CONTENTFUL_DELIVERY_TOKEN.
#   Without them the build falls back to mock data.
# - Pages access is restricted to project members (Settings → General → Visibility → Pages).

image: node:24.19.0-slim

stages:
  - check
  - deploy

variables:
  NEXT_TELEMETRY_DISABLED: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

check:
  stage: check
  script:
    - npm ci --no-audit --no-fund
    - npx tsc --noEmit
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  script:
    - npm ci --no-audit --no-fund
    # Pages may serve the site from a sub-path (https://<group>.<pages-domain>/<project>/).
    - export NEXT_PUBLIC_BASE_PATH="$(node -e 'const p=new URL(process.env.CI_PAGES_URL).pathname.replace(/\/$/,"");process.stdout.write(p)')"
    - echo "basePath='${NEXT_PUBLIC_BASE_PATH}'"
    - npm run build
  publish: out
  artifacts:
    paths:
      - out
    # Keep the GitLab disk small: Pages keeps its own copy after deployment.
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
