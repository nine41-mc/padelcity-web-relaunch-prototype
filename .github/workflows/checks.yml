name: Checks

# Quality gates from QA.md, section 1. Runs on every push to a branch; on main the deploy workflow calls it and
# only deploys when it passes.
on:
  push:
    branches-ignore: [ main ]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code:
    name: Lint, types, Code Connect, tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run figma:check
      - run: npm run tokens:check

  build:
    name: Static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same fonts as the deploy – text widths decide about overflow and wrapping.
      - name: Fetch licensed brand fonts
        uses: actions/checkout@v7
        with:
          repository: nine41-mc/padelcity-brand-fonts
          ssh-key: ${{ secrets.FONTS_DEPLOY_KEY }}
          path: .brand-fonts
      - name: Install fonts into the build
        run: |
          mkdir -p src/app/fonts/licensed
          cp .brand-fonts/GoodBrush.otf .brand-fonts/SoehneSchmal-FettKursiv.ttf src/app/fonts/licensed/
          rm -rf .brand-fonts
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Same data as the deploy (Contentful when the secrets are set, otherwise mock data) – the redirect targets
      # and the club pages only exist with the Contentful clubs. No basePath: QA serves the export from /.
      - name: Build (static export)
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ENVIRONMENT_ID: ${{ vars.CONTENTFUL_ENVIRONMENT_ID || 'master' }}
          CONTENTFUL_DELIVERY_TOKEN: ${{ secrets.CONTENTFUL_DELIVERY_TOKEN }}
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: export
          path: out
          retention-days: 1

  qa:
    name: QA (${{ matrix.browser }})
    needs: build
    # ubuntu-latest moved to 26.04 (Oct 2026); Playwright 1.58 installs its browsers only up to 24.04.
    # Move on together with a Playwright update (package.json and the image in .gitlab-ci.yml).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [ chromium, webkit, firefox ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@v8
        with:
          name: export
          path: out
      - run: npm run qa -- --browsers ${{ matrix.browser }}
      - name: Upload QA report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: qa-report-${{ matrix.browser }}
          path: .qa/report.json
