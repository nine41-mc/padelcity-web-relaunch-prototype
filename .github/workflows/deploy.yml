name: Build & Deploy PadelCity Website Prototype

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # manuell auslösbar (z. B. nach Contentful-Änderungen)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Licensed brand fonts (Söhne Schmal, Good Brush) live in a private repo – read-only deploy key.
      - name: Fetch licensed brand fonts
        uses: actions/checkout@v7
        with:
          repository: nine41-mc/padelcity-brand-fonts
          ssh-key: ${{ secrets.FONTS_DEPLOY_KEY }}
          path: .brand-fonts
      - name: Install fonts into the build
        run: |
          mkdir -p src/app/fonts/licensed
          cp .brand-fonts/GoodBrush.otf .brand-fonts/SoehneSchmal-FettKursiv.ttf src/app/fonts/licensed/
          rm -rf .brand-fonts
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build (static export)
        env:
          # Pages serves the site under /<repo>/ → Next.js basePath
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_TELEMETRY_DISABLED: '1'
          # Optional – without them the build uses mock data
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ENVIRONMENT_ID: ${{ vars.CONTENTFUL_ENVIRONMENT_ID || 'master' }}
          CONTENTFUL_DELIVERY_TOKEN: ${{ secrets.CONTENTFUL_DELIVERY_TOKEN }}
        run: npm run build
      # Pages has no access control → every page is AES-encrypted and asks for the shared password.
      - name: Password-protect the export
        env:
          PROTOTYPE_PASSWORD: ${{ secrets.PROTOTYPE_PASSWORD }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node scripts/encrypt-export.mjs out
      - name: Disable Jekyll (keeps the _next/ folder)
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v5
